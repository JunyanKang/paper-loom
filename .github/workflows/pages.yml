name: Publish update feed
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          mkdir _site
          cp updates.json _site/updates.json
          cp model-presets.json _site/model-presets.json
          cp addon/assets/loom.png _site/loom.png
          cp website/index.html _site/index.html
          mkdir _site/images
          cp docs/images/hero-zh.png docs/images/caption-controls-zh.png docs/images/selection-translation-zh.png docs/images/assistant-zh.png docs/images/references-zh.png docs/images/network-zh.png _site/images/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
